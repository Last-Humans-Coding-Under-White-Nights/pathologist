name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: sh scripts/check_release_tag.sh "${{ github.ref_name }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Fmt
        run: cargo fmt --all -- --check

      - name: Build C API (cdylib)
        run: cargo build -p trace-capi

      - name: Build and run C example (ctrace)
        run: |
          cc crates/trace-capi/examples/ctrace.c \
             -I crates/trace-capi/include \
             -L target/debug -ltrace_capi \
             -o target/ctrace
          export LD_LIBRARY_PATH="$PWD/target/debug"
          ./target/ctrace analyze tests/fixtures/arg_flow \
             -o /tmp/capi.db --full-export
          ./target/ctrace inspect /tmp/capi.db functions main.c 8
          ./target/ctrace inspect /tmp/capi.db symbols main.c 8 9
          ./target/ctrace inspect /tmp/capi.db calls --from entry
          ./target/ctrace inspect /tmp/capi.db callgraph --file main.c --line 8
          ./target/ctrace inspect /tmp/capi.db dataflow --file main.c --line 8 --col 9

  build:
    needs: check
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: trace-linux-x64
          - target: x86_64-pc-windows-gnu
            artifact: trace-windows-x64
          - target: aarch64-unknown-linux-musl
            artifact: trace-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin build provenance instead of leaving the build script to infer it
      # from the runner's checkout, which a restored build-script cache can
      # otherwise carry over stale.
      - name: Pin build metadata
        run: |
          {
            echo "TRACE_BUILD_GIT_SHA=$(git rev-parse --short=7 HEAD)"
            echo "TRACE_BUILD_GIT_DIRTY=false"
            echo "TRACE_BUILD_DATE=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install mingw (windows target)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Install zig + cargo-zigbuild (linux musl targets)
        if: contains(matrix.target, 'linux-musl')
        run: |
          pip3 install --user cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build (linux musl)
        if: contains(matrix.target, 'linux-musl')
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build (windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os == 'Linux' && matrix.target != 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz trace
          cd ../../..

      - name: Package (windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip trace.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing master-latest release
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        run: gh release delete master-latest --yes --cleanup-tag

      - name: Create master-latest release
        if: github.ref == 'refs/heads/master'
        run: |
          gh release create master-latest \
            --target "${{ github.sha }}" \
            --title "master-latest" \
            --notes "Latest build from master" \
            --prerelease \
            artifacts/*

      - name: Create tagged release
        if: github.ref_type == 'tag'
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
