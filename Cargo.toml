[workspace]
resolver = "2"
members = [
    "crates/trace-ir",
    "crates/trace-preproc",
    "crates/trace-parse",
    "crates/trace-analysis",
    "crates/trace-db",
    "crates/trace-capi",
    "crates/trace-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["trace contributors"]

[workspace.dependencies]
trace-ir = { path = "crates/trace-ir" }
trace-preproc = { path = "crates/trace-preproc" }
trace-parse = { path = "crates/trace-parse" }
trace-analysis = { path = "crates/trace-analysis" }
trace-db = { path = "crates/trace-db" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
petgraph = "0.7"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-c = "0.24"
walkdir = "2"
rayon = "1"
tempfile = "3"
