[workspace]
resolver = "2"
members = [
    "crates/trace-ir",
    "crates/trace-preproc",
    "crates/trace-parse",
    "crates/trace-analysis",
    "crates/trace-db",
    "crates/trace-capi",
    "crates/trace-cli",
    "crates/trace-merge",
    "crates/trace-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["trace contributors"]

[workspace.dependencies]
trace-ir = { path = "crates/trace-ir" }
trace-preproc = { path = "crates/trace-preproc" }
trace-parse = { path = "crates/trace-parse" }
trace-analysis = { path = "crates/trace-analysis" }
trace-db = { path = "crates/trace-db" }

anyhow = "1"
hashbrown = { version = "0.17", default-features = false }
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
mimalloc = "0.1"
petgraph = "0.7"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-c = "0.24"
url = "2"
walkdir = "2"
rayon = "1"
tempfile = "3"

# ThinLTO and a single codegen unit: the configuration docs/EVAL_REPORT.md
# measures. Slower release compiles for a faster analyzer.
[profile.release]
lto = "thin"
codegen-units = 1

# Line-tables only for dev and test builds reduces linker time and dSYM
# generation overhead on macOS while preserving file:line info in panic
# backtraces (#214). `test` inherits from `dev`, so keeping the setting here
# lets `cargo build` and `cargo test` share dependency artifacts.
[profile.dev]
debug = 1
